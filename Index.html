<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  
  <!-- PWA Metadata & iOS Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --muted: #a0a0a0;
      --border: #333333;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      user-select: none;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    textarea {
      width: 100%;
      height: 120px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .exercise-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      background: var(--card);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
    }
    .item.done {
      opacity: 0.6;
      text-decoration: line-through;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Gym Routine Tracker</h1>

  <textarea id="routineInput" placeholder="Paste routine here (one exercise per line)..."></textarea>
  <button id="saveBtn">Save Routine</button>

  <div class="exercise-list" id="exerciseList"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker failure', err));
      });
    }

    const STORAGE_KEY = 'gym_routine_data';

    function getTodayKey() {
      return new Date().toISOString().split('T')[0];
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : { routine: [], completed: {}, lastDate: getTodayKey() };
      
      if (data.lastDate !== getTodayKey()) {
        data.completed = {};
        data.lastDate = getTodayKey();
        saveData(data);
      }
      return data;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function render() {
      const data = loadData();
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      if (data.routine.length === 0) {
        listEl.innerHTML = '<p style="color:var(--muted)">No exercises saved yet.</p>';
        return;
      }

      data.routine.forEach((text, idx) => {
        const isDone = Boolean(data.completed[idx]);

        const div = document.createElement('div');
        div.className = `item ${isDone ? 'done' : ''}`;

        const span = document.createElement('span');
        span.textContent = text;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isDone;
        checkbox.disabled = isDone;

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            data.completed[idx] = true;
            saveData(data);
            render();
          }
        });

        div.appendChild(span);
        div.appendChild(checkbox);
        listEl.appendChild(div);
      });
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const input = document.getElementById('routineInput').value;
      const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const data = loadData();
      data.routine = lines;
      data.completed = {};
      saveData(data);
      document.getElementById('routineInput').value = '';
      render();
    });

    render();
  </script>
</body>
</html>
