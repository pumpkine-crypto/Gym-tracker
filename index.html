<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --muted: #a0a0a0;
      --border: #333333;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    .day-badge {
      background: var(--border);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .exercise-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      background: var(--card);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
    }
    .item.done {
      opacity: 0.6;
      text-decoration: line-through;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Gym Tracker</h1>
    <div class="day-badge" id="currentDayBadge">...</div>
  </div>

  <textarea id="routineInput" placeholder="Paste full weekly routine like this:

Monday:
Bench Press 3x10
Incline DB Press 3x12

Tuesday:
Pull Ups 4x8
Barbell Rows 3x10"></textarea>
  <button id="saveBtn">Save Routine</button>

  <div class="exercise-list" id="exerciseList"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    const STORAGE_KEY = 'gym_routine_data';
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // Returns a custom date key that shifts at 6:00 AM daily
    function getResetDateKey() {
      const now = new Date();
      // If time is before 6 AM, treat it as part of the previous day
      if (now.getHours() < 6) {
        now.setDate(now.getDate() - 1);
      }
      return {
        dateKey: now.toISOString().split('T')[0],
        dayName: DAYS[now.getDay()]
      };
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const { dateKey, dayName } = getResetDateKey();
      
      const defaultData = { weeklySchedule: {}, completed: {}, lastResetKey: dateKey };
      const data = raw ? JSON.parse(raw) : defaultData;

      // Auto-reset if 6:00 AM milestone has passed for a new day
      if (data.lastResetKey !== dateKey) {
        data.completed = {};
        data.lastResetKey = dateKey;
        saveData(data);
      }

      return { data, currentDay: dayName };
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Parses raw text input into day-by-day mapping
    function parseWeeklyRoutine(text) {
      const lines = text.split('\n');
      const schedule = {};
      let currentDayKey = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Check if line matches a day header (e.g. "Monday:", "tuesday")
        const matchedDay = DAYS.find(d => d.toLowerCase() === trimmed.replace(':', '').toLowerCase());

        if (matchedDay) {
          currentDayKey = matchedDay;
          if (!schedule[currentDayKey]) schedule[currentDayKey] = [];
        } else if (currentDayKey) {
          schedule[currentDayKey].push(trimmed);
        }
      });

      return schedule;
    }

    function render() {
      const { data, currentDay } = loadData();
      
      document.getElementById('currentDayBadge').textContent = currentDay;
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      const todaysExercises = data.weeklySchedule[currentDay] || [];

      if (todaysExercises.length === 0) {
        listEl.innerHTML = `<p style="color:var(--muted)">No exercises saved for ${currentDay}. Paste your schedule above to set it up.</p>`;
        return;
      }

      todaysExercises.forEach((text, idx) => {
        const itemKey = `${currentDay}_${idx}`;
        const isDone = Boolean(data.completed[itemKey]);

        const div = document.createElement('div');
        div.className = `item ${isDone ? 'done' : ''}`;

        const span = document.createElement('span');
        span.textContent = text;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isDone;
        checkbox.disabled = isDone;

        checkbox.addEventListener('change', () => {
          if (checkbox.checked) {
            data.completed[itemKey] = true;
            saveData(data);
            render();
          }
        });

        div.appendChild(span);
        div.appendChild(checkbox);
        listEl.appendChild(div);
      });
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const input = document.getElementById('routineInput').value;
      const parsedSchedule = parseWeeklyRoutine(input);

      if (Object.keys(parsedSchedule).length === 0) {
        alert("Please make sure to label days clearly (e.g., 'Monday:', 'Tuesday:').");
        return;
      }

      const { data } = loadData();
      data.weeklySchedule = parsedSchedule;
      data.completed = {}; // Reset tracking when new routine is saved
      saveData(data);
      document.getElementById('routineInput').value = '';
      render();
    });

    render();
  </script>
</body>
</html>
